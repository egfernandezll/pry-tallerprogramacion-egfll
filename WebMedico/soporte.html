<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PRY-EGFLL — Soporte técnico" />
  <meta name="author" content="efernandez" />
  <title>PRY-EGFLL — Soporte</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/soporte.css" />
  <link rel="stylesheet" href="css/soporte.animations.css" />
</head>
<body>

  <header>
    <h1>PRY-EGFLL</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="soporte.html" class="activo">Soporte</a></li>
    </ul>
  </nav>

  <main>
    <div class="soporte-body">

      <!-- panel izquierdo con ilustración flotante -->
      <div class="soporte-left">
        <div class="soporte-illus"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#0d6efd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg></div>
        <div class="soporte-left-title">¿En qué podemos ayudarte?</div>
        <div class="soporte-left-sub">Nuestro equipo responde en menos de 24 horas hábiles.</div>
        <div class="s-badges">
          <span class="s-badge s-primary">Técnico</span>
          <span class="s-badge s-success">Accesos</span>
          <span class="s-badge s-warning">Reportes</span>
          <span class="s-badge s-info">Capacitación</span>
        </div>
      </div>

      <!-- panel derecho con formulario -->
      <div class="soporte-right">
        <div class="s-title">Enviar consulta</div>
        <div class="s-sub">Completa el formulario y te contactaremos a la brevedad.</div>

        <div class="s-group">
          <label class="s-label" for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="idUsuario" />
        </div>
        <div class="s-group">
          <label class="s-label" for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="correo@pryegfll.pe" />
        </div>
        <div class="s-group">
          <label class="s-label" for="tipo">Tipo de consulta</label>
          <select id="tipo">
            <option value="" disabled selected>Seleccione</option>
            <option>Problema técnico</option>
            <option>Acceso al sistema</option>
            <option>Reportes</option>
            <option>Capacitación</option>
          </select>
        </div>
        <div class="s-group">
          <label class="s-label" for="mensaje">Mensaje</label>
          <textarea id="mensaje" placeholder="Describe tu consulta..."></textarea>
        </div>

        <button class="btn-soporte" type="button">
          <!-- ícono SVG enviar estilo login -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Enviar consulta
        </button>
      </div>

    </div>
  </main>

  <footer>
    &copy; 2026 PRY-EGFLL &middot; efernandez
  </footer>

</body>
</html>
